name: college-erp
region: nyc

services:
  - name: web
    github:
      repo: Jahongir359/College-ERP
      branch: main
      deploy_on_push: true
    # Built from the Dockerfile, which also compiles the Flutter web app served at /app/
    # (its output is no longer committed). The image starts Gunicorn on $PORT (8080).
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    routes:
      - path: /
    envs:
      # ── Django ────────────────────────────────────────────────────────────
      - key: DJANGO_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DJANGO_DEBUG
        scope: RUN_AND_BUILD_TIME
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        scope: RUN_AND_BUILD_TIME
        value: "${APP_DOMAIN},app.iceberglc.com"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: "https://iceberglc.com,https://www.iceberglc.com,https://app.iceberglc.com"
      - key: CSRF_TRUSTED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: "https://${APP_DOMAIN},https://app.iceberglc.com"
      - key: REGISTRATION_LEADS_API_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # ── Database ──────────────────────────────────────────────────────────
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # ── Recovery admin ────────────────────────────────────────────────────
      - key: RECOVERY_ADMIN_EMAIL
        scope: RUN_AND_BUILD_TIME
        value: "iceberg.edu.center@gmail.com"
      - key: RECOVERY_ADMIN_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # ── Email (SMTP) ──────────────────────────────────────────────────────
      - key: EMAIL_HOST_USER
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # ── Firebase ──────────────────────────────────────────────────────────
      - key: FCM_SERVICE_ACCOUNT_JSON
        scope: RUN_AND_BUILD_TIME
        type: SECRET

# PRE_DEPLOY job: runs migrations before traffic hits the new release.
# jobs is a TOP-LEVEL key — not nested inside services.
jobs:
  - name: db-migrate
    kind: PRE_DEPLOY
    github:
      repo: Jahongir359/College-ERP
      branch: main
    dockerfile_path: Dockerfile
    run_command: sh -c "cd backend && python manage.py migrate --noinput"
    instance_size_slug: basic-xxs
    envs:
      - key: DJANGO_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DJANGO_DEBUG
        scope: RUN_AND_BUILD_TIME
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        scope: RUN_AND_BUILD_TIME
        value: "${APP_DOMAIN},app.iceberglc.com"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: RECOVERY_ADMIN_EMAIL
        scope: RUN_AND_BUILD_TIME
        value: "iceberg.edu.center@gmail.com"
      - key: RECOVERY_ADMIN_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET
