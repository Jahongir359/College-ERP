name: Django CI

# Runs only when the Django side changes; the Flutter app has its own workflow (flutter.yml).
on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "college_management_system"
      - "main_app"
      - "manage.py"
      - "requirements.txt"
      - "runtime.txt"
      - "ruff.toml"
      - "infra/public/**"
      - ".github/workflows/django.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "college_management_system"
      - "main_app"
      - "manage.py"
      - "requirements.txt"
      - "runtime.txt"
      - "ruff.toml"
      - "infra/public/**"
      - ".github/workflows/django.yml"

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install ruff==0.15.15
    - name: Run Ruff
      run: |
        python -m ruff check .
        python -m ruff format --check .
    - name: Run Django Checks
      run: |
        python manage.py check
        python manage.py makemigrations --check --dry-run
        python manage.py collectstatic --noinput --dry-run -v 0
    - name: Run Tests
      run: |
        python manage.py test
